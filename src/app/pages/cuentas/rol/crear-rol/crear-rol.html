<h2 mat-dialog-title>
  {{ isEditMode ? 'Editar Rol: ' + data.rol.nombre : 'Crear Nuevo Rol' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Nombre del Rol</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej: admin_taller, cliente" />
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es requerido</mat-error>
      <mat-error *ngIf="form.get('nombre')?.hasError('minlength')">Mínimo 3 caracteres</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="guardar()" [disabled]="isSaving || form.invalid">
    <span *ngIf="!isSaving">{{ isEditMode ? 'Actualizar Rol' : 'Guardar Rol' }}</span>
    <span *ngIf="isSaving" style="display: flex; align-items: center; gap: 8px;">
      <mat-spinner diameter="16"></mat-spinner>
      {{ isEditMode ? 'Actualizando...' : 'Guardando...' }}
    </span>
  </button>
</mat-dialog-actions>
