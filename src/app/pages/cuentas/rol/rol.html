<mat-card>
  <mat-card-header>
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 16px;">
      <mat-card-title>Gestión de Roles</mat-card-title>
      <button mat-raised-button color="primary" (click)="crearRol()">
        <mat-icon>add</mat-icon>
        @if (!isMobile) { Crear Nuevo Rol }
      </button>
    </div>
  </mat-card-header>

  <mat-card-content>

    @if (isLoading) {
      <div style="display: flex; justify-content: center; padding: 40px;">
        <mat-spinner diameter="50"></mat-spinner>
      </div>
    }

    @if (!isLoading && dataSource.length > 0) {
      <table mat-table [dataSource]="dataSource" class="w-full">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let element">{{ element.id }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button matTooltip="Gestionar privilegios" (click)="gestionarPrivilegios(element)" color="accent">
              <mat-icon>shield</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Editar" (click)="editRol(element)" color="primary">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Eliminar" (click)="deleteRol(element)" color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    }

    @if (!isLoading && dataSource.length === 0) {
      <div style="text-align: center; padding: 40px;">
        <mat-icon style="font-size: 48px; width: 48px; height: 48px; color: #ccc;">info</mat-icon>
        <p style="color: #999; margin-top: 16px;">No hay roles disponibles</p>
      </div>
    }

    @if (dataSource.length > 0) {
      <mat-paginator
        [length]="totalItems"
        [pageSize]="pageSize"
        hidePageSize="true"
        (page)="onPageChange($event)">
      </mat-paginator>
    }

  </mat-card-content>
</mat-card>
